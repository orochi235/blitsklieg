name: Release

on:
  push:
    tags: ['v*']

# No NPM_TOKEN: this publishes via npm trusted publishing (OIDC), so the
# credential is short-lived and minted per run. `id-token: write` is what
# makes that possible — without it npm falls back to looking for a token
# and fails. The npmjs.com side must name this exact filename.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The version lives in the workspace, not the private root package,
      # which has no version field at all.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="v$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match packages/core/package.json $pkg"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # prepublishOnly runs the checks again; these steps exist so a failure
      # names which one broke instead of surfacing as a failed publish.
      - name: Publish
        run: npm publish --workspace blitsklieg --provenance --access public
