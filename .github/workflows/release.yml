name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.2.1'
        required: true

permissions:
  contents: read
  # Mints the OIDC token npm exchanges for a provenance attestation. Without it the publish
  # still succeeds and silently ships unattested.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # prepublishOnly runs this too; running it here fails the job before anything is published
      # rather than during, when a half-finished publish is not something you can take back.
      - run: npm run check

      # The tag names the release, so a tag that disagrees with package.json means one of the two
      # is wrong — and finding out after publishing is finding out too late.
      - name: Check the tag matches the package version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="v$(node -p "require('./packages/core/package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi

      - run: npm publish --workspace blitsklieg --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
